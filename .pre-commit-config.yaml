repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: docs-analysis
        name: Documentation Analysis
        entry: uv run python scripts/analyze_docs.py
        language: system
        stages: [pre-push]
        pass_filenames: false
